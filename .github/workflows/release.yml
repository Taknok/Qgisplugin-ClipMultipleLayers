name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish again (without the v prefix)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7

      - name: Install semantic-release
        run: npm install --no-package-lock

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "released=false" >> "$GITHUB_OUTPUT"
          npm exec -- semantic-release

  publish-qgis-plugin:
    needs: semantic-release
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.semantic-release.outputs.released == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ inputs.release_version || needs.semantic-release.outputs.version }}

      - uses: actions/setup-python@v7

      - name: Install qgis-plugin-ci
        run: python -m pip install qgis-plugin-ci

      - name: Check GitHub release asset
        id: github-asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version || needs.semantic-release.outputs.version }}
        run: |
          release_tag="v$RELEASE_VERSION"
          asset_name="Clip Multiple Layers.$RELEASE_VERSION.zip"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            echo "::error::GitHub release $release_tag does not exist. Publish the semantic release first."
            exit 1
          fi
          if gh release view "$release_tag" --json assets --jq '.assets[].name' \
            | grep -Fxq "$asset_name"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The ZIP is already attached to $release_tag; skipping duplicate GitHub upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and publish to QGIS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version || needs.semantic-release.outputs.version }}
          GITHUB_ASSET_EXISTS: ${{ steps.github-asset.outputs.exists }}
        run: |
          if [[ -z "$QGIS_PLUGIN_TOKEN" ]]; then
            echo "::error::Set the QGIS_PLUGIN_TOKEN Actions secret before publishing."
            exit 1
          fi
          release_args=(
            release "$RELEASE_VERSION"
            --release-tag "v$RELEASE_VERSION"
            --qgis-token "$QGIS_PLUGIN_TOKEN"
            --allow-uncommitted-changes
            --disable-submodule-update
          )
          if [[ "$GITHUB_ASSET_EXISTS" != "true" ]]; then
            release_args+=(--github-token "$GITHUB_TOKEN")
          fi
          qgis-plugin-ci "${release_args[@]}"
